[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the browser cart's catalog URL identical to the Express version.
[[redirects]]
  from = "/api/products"
  to = "/products.json"
  status = 200
